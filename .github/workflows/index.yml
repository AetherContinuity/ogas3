name: index

# Päivittää käyttöliittymän hakemiston (snapshots/index.json) kun traceja
# lisätään tai snapshotia muutetaan käsin. Kuukausiajo kirjoittaa
# hakemiston itse; sen GITHUB_TOKEN-push ei laukaise tätä, joten
# silmukkaa ei synny. Polkusuodatin ei osu tiivistelmiin eikä
# index.jsoniin, samasta syystä.

on:
  push:
    branches: [main]
    paths:
      - "traces/**"
      - "snapshots/[0-9][0-9][0-9][0-9]-[0-9][0-9].json"
      - "summary.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-snapshot       # sama ryhmä: ei kilpaile kuukausiajon kanssa
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testit
        run: python3 tests/test_all.py
      - name: Tiivistelmät
        run: python3 summary.py
      - name: Commit
        run: |
          git config user.name  "ogas3-index"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots/*.summary.json snapshots/index.json
          if git diff --cached --quiet; then
            echo "ei muutoksia"
          else
            git commit -m "index: tiivistelmät päivitetty"
            git push
          fi
