name: katselmointi

# Riippumaton LLM-katselmointi (Kimi K3.1 Pro). Vain käsin.
# Vastaus committataan katselmoinnit/-hakemistoon.

on:
  workflow_dispatch:
    inputs:
      pyynto:
        description: "Pyyntötiedosto repossa"
        default: "katselmoinnit/q001-pyynto.txt"
        required: true

permissions:
  contents: write

jobs:
  katselmoi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Katselmoi
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PYYNTO: ${{ inputs.pyynto }}
        run: python3 tools/katselmointi.py "$PYYNTO"
      - name: Commit
        if: always()
        run: |
          git config user.name  "ogas3-katselmointi"
          git config user.email "actions@users.noreply.github.com"
          git add katselmoinnit/
          git commit -m "katselmointi: Kimi K3.1 Pro -vastaus" || echo "ei muutoksia"
          git pull --rebase origin main
          git push
