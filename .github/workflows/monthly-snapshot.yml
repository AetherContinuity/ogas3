name: monthly-snapshot

# Kuukausittainen tilannekaappaus. Ajetaan kuukauden 1. päivä klo 06:17 UTC,
# varmistusajo samana päivänä klo 13:41 UTC.
#
# MIKSI EI TASATUNTI JA MIKSI VARMISTUSAJO
# 1.10.2026 klo 06:00 UTC ajastus ei käynnistynyt lainkaan: GitHub pudottaa
# ajastettuja ajoja kuormahuipuissa ilman ilmoitusta, ja kuun 1. päivän
# tasatunti on pahin hetki. Kaappaus tehtiin käsiajona (workflow_dispatch,
# run 36862714217). Minuutti 17 vähentää riskiä; varmistusajo ajaa
# kaappauksen vain, jos kuun tiedosto puuttuu vielä mainista.
# Snapshotin trigger-kenttä kertoo, millä tapahtumalla kaappaus syntyi.
#
# MIKSI CI EIKÄ PAIKALLINEN AJO
# PRE-sarja väittää mittaavansa sitä, mitä olisi voitu tietää kyseisenä
# kuukautena. Se väite on todennettavissa vain jos ajohetki on kolmannen
# osapuolen kirjaama. Paikallisessa ajossa retrieved_at on ajajan koneen
# kello; täällä se on ajolokissa yhdessä commit-SHA:n kanssa.
#
# Sivutuote: commitoitu snapshots/-hakemisto ON aikasarja. Erillistä
# tietokantaa ei tarvita.

on:
  schedule:
    - cron: "17 6 1 * *"     # pääajo
    - cron: "41 13 1 * *"    # varmistus: ajaa vain jos pääajo puuttuu
  workflow_dispatch:          # savutesti oletuksena — ks. dry_run
    inputs:
      dry_run:
        description: "Savutesti: hae ja tarkista, älä kirjoita eikä committoi. Pois päältä vain nolla-pisteen tms. tahallista käsinkaappausta varten."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monthly-snapshot
  cancel-in-progress: false

jobs:
  # Varmistusajo ohitetaan, jos kuun kaappaus on jo mainissa. Muut
  # tapahtumat (pääajo, käsiajo) menevät aina läpi.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          FILE="snapshots/$(date -u +%Y-%m).json"
          if [ "${{ github.event.schedule }}" = "41 13 1 * *" ] && [ -f "$FILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$FILE on jo olemassa — varmistusajo ohitetaan"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.schedule }}" = "41 13 1 * *" ]; then
              echo "::warning::pääajo puuttui — varmistusajo kaappaa"
            fi
          fi

  snapshot:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      # Cronilla ei koskaan; käsinajolla inputin mukaan (oletus savutesti).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Riippuvuuksia ei ole. Moottori käyttää pelkkää vakiokirjastoa —
      # tämä on tarkoituksellista: jokainen riippuvuus on ylläpidettävä
      # ja jokainen versionosto on mahdollinen hiljainen muutos.
      - name: Testit
        run: python3 tests/test_all.py

      - name: Kaappaus
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 snapshot.py --dry-run
          else
            python3 snapshot.py
          fi

      # Seurannassa olevien ketjujen tracet: uusi revisio kerran kuussa.
      # Epäonnistunut päivitys ei kaada kaappausta — se näkyy lokissa.
      - name: Seurannan tracet
        if: env.DRY_RUN != 'true'
        run: python3 promote.py refresh || echo "::warning::osa tracepäivityksistä epäonnistui"

      - name: Commit
        if: env.DRY_RUN != 'true'
        run: |
          MONTH=$(date -u +%Y-%m)
          FILE="snapshots/${MONTH}.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE puuttuu — kaappaus ei tuottanut tiedostoa"
            exit 1
          fi
          N=$(python3 -c "import json;print(json.load(open('$FILE'))['totals']['events'])")
          A=$(python3 -c "import json;print(json.load(open('$FILE'))['totals']['anomalies'])")
          if [ "$N" -eq 0 ]; then
            echo "::error::kaappaus tuotti 0 tapahtumaa — ylävirta todennäköisesti alhaalla"
            exit 1
          fi
          git config user.name  "ogas3-snapshot"
          git config user.email "actions@users.noreply.github.com"
          python3 summary.py >/dev/null
          git add "$FILE" snapshots/*.summary.json snapshots/index.json snapshots/yva-rekisteri.json snapshots/vahti-rekisteri.json traces/
          if git diff --cached --quiet; then
            echo "ei muutoksia"
          else
            git commit -m "snapshot ${MONTH}: ${N} tapahtumaa, ${A} anomaliaa"
            git push
          fi

      - name: Yhteenveto
        if: always() && env.DRY_RUN != 'true'
        run: |
          MONTH=$(date -u +%Y-%m)
          FILE="snapshots/${MONTH}.json"
          [ -f "$FILE" ] || exit 0
          {
            echo "### OGAS3 — kaappaus ${MONTH}"
            python3 - "$FILE" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"- tapahtumia: **{d['totals']['events']}**")
          print(f"- anomalioita: **{d['totals']['anomalies']}**")
          print(f"- lähteet: {', '.join(d['totals']['sources'])}")
          print(f"- luokitus: `{d['status']['classification']}`")
          errs = [q for q in d["queries"] if "error" in q]
          if errs:
              print(f"\n**Epäonnistuneet kyselyt ({len(errs)}):**\n")
              for q in errs[:10]:
                  print(f"- {q.get('source')} {q.get('valmisteluvaihe') or q.get('tunnus')}: {q['error'][:120]}")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
