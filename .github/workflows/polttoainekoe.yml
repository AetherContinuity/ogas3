name: polttoainekoe

# Synapsimoottorin kokeilu julkisilla polttoainehinnoilla (tools/polttoaine.py). Käsin.
on:
  workflow_dispatch:
    inputs:
      vaihe:
        description: "kartoita | aja"
        default: "kartoita"
        required: true

permissions:
  contents: write

jobs:
  koe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aja
        run: python3 tools/polttoaine.py "${{ inputs.vaihe }}"
      - name: Commit
        if: inputs.vaihe != 'kartoita'
        run: |
          git config user.name  "ogas3-polttoainekoe"
          git config user.email "actions@users.noreply.github.com"
          git add data/polttoaine/
          git commit -m "polttoainekoe: $(date -u +%Y-%m-%d)" || { echo "ei muutoksia"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
