name: q002

# Q-002 mittaus (NKT). Vain käsin. Tulos committataan sellaisenaan.
on:
  workflow_dispatch:
    inputs:
      h:
        description: "Hypoteesi"
        type: choice
        options: [H1, H2, H3, H4, H1p1]
        default: "H1"
        required: true

permissions:
  contents: write

jobs:
  mittaa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mittaa
        env:
          H: ${{ inputs.h }}
        run: |
          set -euo pipefail
          mkdir -p ennakkorekisteroinnit/nkt/tulokset
          tmp=$(mktemp)
          if [ "$H" = "H1p1" ]; then OUT="ennakkorekisteroinnit/nkt/tulokset/H1-poikkeama_1-$(date -u +%F).json"; else OUT="ennakkorekisteroinnit/nkt/tulokset/$H-$(date -u +%F).json"; fi
          if [ "$H" = "H1p1" ]; then python3 ennakkorekisteroinnit/nkt/q002_poikkeama_1.py H1 > "$tmp"; else python3 ennakkorekisteroinnit/nkt/q002.py "$H" > "$tmp"; fi
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$tmp"
          mv "$tmp" "$OUT"
      - name: Commit
        run: |
          git config user.name  "ogas3-q002"
          git config user.email "actions@users.noreply.github.com"
          git add ennakkorekisteroinnit/nkt/tulokset/
          git commit -m "q002: mittaus ${{ inputs.h }}" || echo "ei muutoksia"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
