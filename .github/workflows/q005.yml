name: q005

# Q-005 mittaus (palautuminen). Vain käsin. Tulos committataan sellaisenaan.
on:
  workflow_dispatch:
    inputs:
      h:
        description: "Hypoteesi"
        type: choice
        options: [H1]
        default: "H1"
        required: true

permissions:
  contents: write

jobs:
  mittaa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mittaa
        env:
          H: ${{ inputs.h }}
        run: |
          set -euo pipefail
          mkdir -p ennakkorekisteroinnit/palautuminen/tulokset
          tmp=$(mktemp)
          OUT="ennakkorekisteroinnit/palautuminen/tulokset/$H-$(date -u +%F).json"
          python3 ennakkorekisteroinnit/palautuminen/q005.py "$H" > "$tmp"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$tmp"
          mv "$tmp" "$OUT"
      - name: Commit
        run: |
          git config user.name  "ogas3-q005"
          git config user.email "actions@users.noreply.github.com"
          git add ennakkorekisteroinnit/palautuminen/tulokset/
          git commit -m "q005: mittaus ${{ inputs.h }}" || echo "ei muutoksia"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
