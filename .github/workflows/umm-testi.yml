name: umm-testi

# Kokeilu: vastaako Nord Pool REMIT UMM API ilman avainta. Ei committaa.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/umm_testi.py
