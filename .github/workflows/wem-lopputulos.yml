name: wem-lopputulos

# WEM-L1: fyysisten lopputulosten mittaus 1.10.2026–31.3.2027 (data/wem-lopputulos/rekisterointi.json).
# Ei ennuste. Ajo kuukauden 2. päivä marras–huhtikuussa; jokainen ajo hakee koko ikkunan alusta
# (jälkikäteen täydentyneet vartit mukaan). Tila: data/wem-lopputulos/tila.json.

on:
  schedule:
    - cron: "41 4 2 11,12,1,2,3,4 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mittaa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kerää
        run: python3 tools/wem_lopputulos.py kerää --out data/wem-lopputulos/2026-2027.json
      - name: Arvioi
        if: always()
        run: python3 tools/wem_lopputulos.py arvioi data/wem-lopputulos/rekisterointi.json --aineisto data/wem-lopputulos/2026-2027.json --out data/wem-lopputulos/tila.json
      - name: Commit
        if: always()
        run: |
          git config user.name  "ogas3-wem-lopputulos"
          git config user.email "actions@users.noreply.github.com"
          git add data/wem-lopputulos/2026-2027.json data/wem-lopputulos/tila.json
          git commit -m "wem-lopputulos: $(date -u +%Y-%m-%d)" || { echo "ei muutoksia"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
